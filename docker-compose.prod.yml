services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-eit_app}
      - POSTGRES_USER=${POSTGRES_USER:-eit_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eit_user} -d ${POSTGRES_DB:-eit_app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      - DJANGO_DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eit_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eit_app}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
