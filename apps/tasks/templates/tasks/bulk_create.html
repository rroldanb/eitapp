{% extends "base.html" %}

{% block content %}
<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="mt-12 bg-gray-100 p-6 rounded-lg shadow-md w-full sm:max-w-2xl">
            <h1 class="text-center text-3xl font-bold bg-gradient-primary text-white py-4 px-6 rounded-lg mb-2">
                <i class="fas fa-layer-group mr-2" aria-hidden="true"></i> Tareas Masivas
            </h1>
            <p class="text-center text-gray-500 text-sm mb-6">Ingresá una tarea por línea</p>

            {% if error %}
            <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                {{ error }}
            </div>
            {% endif %}

            <div class="bg-white rounded-lg shadow p-6">
                <form method="POST" class="space-y-4">
                    {% csrf_token %}
                    {% for field in form %}
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div class="flex gap-3 pt-2">
                        <a href="{% url 'task_list' %}"
                            class="flex-1 px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors text-sm font-medium text-center">
                            <i class="fas fa-times mr-1"></i> Cancelar
                        </a>
                        <button type="submit"
                            class="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition-colors font-medium"
                            onclick="this.disabled=true; this.form.submit();">
                            <i class="fas fa-layer-group mr-1"></i> Crear Tareas
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
