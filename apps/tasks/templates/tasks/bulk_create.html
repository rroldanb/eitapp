{% extends "base.html" %}

{% block content %}
<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="w-full md:w-1/2 mt-12">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Crear Tareas Masivas</h1>
                <p class="text-center text-gray-500 text-sm mb-6">Una tarea por línea</p>

                {% if error %}
                <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="space-y-4">
                    {% csrf_token %}
                    {% for field in form %}
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition-colors font-medium"
                        onclick="this.disabled=true; this.form.submit();">
                        <i class="fas fa-layer-group mr-1"></i>Crear Tareas
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
