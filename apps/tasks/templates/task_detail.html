{% extends "base.html" %}

{% block content %}

<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="w-full sm:w-full md:w-1/3 mt-12">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">Detalles de la Tarea</h1>
                {% if task.is_important %}
                    <h2 class="text-xl font-semibold text-center text-red-600 mb-4">{{ task.title }}</h2>
                {% else %}
                    <h2 class="text-xl font-semibold text-center text-green-600 mb-4">{{ task.title }}</h2>
                {% endif %}

                {% if error %}
                <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="space-y-4">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors font-medium"
                        onclick="this.disabled=true; this.form.submit();">
                        Actualizar
                    </button>
                </form>

                <div class="flex flex-col sm:flex-row justify-around mt-4 space-y-2 sm:space-y-0 sm:space-x-2">
                    <form action="{% url 'delete_task' task.id %}" method="POST" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition-colors font-medium"
                            onclick="this.disabled=true; this.form.submit();">
                            Eliminar
                        </button>
                    </form>

                    <form action="{% url 'complete_task' task.id %}" method="POST" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full bg-emerald-600 text-white py-2 px-4 rounded-lg hover:bg-emerald-700 transition-colors font-medium"
                            onclick="this.disabled=true; this.form.submit();">
                            Completar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

{% endblock %}
