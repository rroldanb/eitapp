{% extends "base.html" %}

{% block content %}

<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="w-full md:w-1/3 mt-12">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">Task Details</h1>
                {% if task.is_important %}
                    <h3 class="text-xl font-semibold text-center text-red-600 mb-4">{{ task.title }}</h3>
                {% else %}
                    <h3 class="text-xl font-semibold text-center text-green-600 mb-4">{{ task.title }}</h3>
                {% endif %}

                {% if error %}
                <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="space-y-4">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="w-full bg-gray-800 text-white py-2 px-4 rounded-lg hover:bg-gray-700 transition-colors font-medium">
                        Update
                    </button>
                </form>

                <div class="flex justify-around mt-4 space-x-2">
                    <form action="{% url 'delete_task' task.id %}" method="POST" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition-colors font-medium">
                            Delete
                        </button>
                    </form>

                    <form action="{% url 'complete_task' task.id %}" method="POST" class="flex-1">
                        {% csrf_token %}
                        <button type="submit" class="w-full bg-gray-500 text-white py-2 px-4 rounded-lg hover:bg-gray-600 transition-colors font-medium">
                            Complete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

{% endblock %}
