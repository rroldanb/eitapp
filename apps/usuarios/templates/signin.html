{% extends "base.html" %}

{% block content %}
<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="w-full md:w-1/3 mt-12">
            <form method="POST" class="bg-white p-6 rounded-lg shadow-md">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Iniciar Sesi&oacute;n</h1>

                {% if error %}
                <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    {{ error }}
                </div>
                {% endif %}

                {% csrf_token %}
                <div class="mb-4">
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Nombre de usuario:</label>
                    <input type="text" name="username" id="username"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Ingrese su nombre de usuario"
                        required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Contrase&ntilde;a:</label>
                    <input type="password" name="password" id="password"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Ingrese su contrase&ntilde;a"
                        required>
                </div>
                <button type="submit" class="w-full bg-gray-800 text-white py-2 px-4 rounded-lg hover:bg-gray-700 transition-colors font-medium"
                    onclick="this.disabled=true; this.form.submit();">
                    Iniciar Sesi&oacute;n
                </button>
<span class="text-xs bg-red-500 text-gray-500 mb-2">Gago was here</span>
 <footer class="fixed bottom-2 bg-red-500 right-2 flex items-center gap-1">
  <div class="relative group">
    <button class="flex items-center gap-1.5 text-xs px-2 py-1 bg-gray-800 text-gray-300 rounded font-mono opacity-60 hover:opacity-100 transition-opacity">
      <span class="w-1.5 h-1.5 rounded-full {% if db_info.engine == 'postgresql' %}bg-green-400{% else %}bg-yellow-400{% endif %}"></span>
      {{ db_info.alias }}
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>
    <div class="absolute bottom-full right-0 mb-1 hidden group-hover:block group-focus-within:block">
      <div class="bg-gray-800 rounded-lg shadow-xl py-1 min-w-[140px]">
        <a href="{% url 'switch_db' 'default' %}" class="block px-3 py-1.5 text-xs text-gray-300 hover:bg-gray-700 hover:text-white no-underline {% if db_info.alias == 'default' %}bg-gray-700 text-white{% endif %}">
          default
          <span class="text-gray-500 ml-1">({{ db_info.engine }})</span>
        </a>
        {% for alias, db in databases.items %}
          <a href="{% url 'switch_db' alias %}" class="block px-3 py-1.5 text-xs text-gray-300 hover:bg-gray-700 hover:text-white no-underline {% if db_info.alias == alias %}bg-gray-700 text-white{% endif %}">
            {{ alias }}
            <span class="text-gray-500 ml-1">({{ db.ENGINE|cut:"django.db.backends." }})</span>
          </a>
        {% endfor %}
      </div>
    </div>  
  </div>
</footer> 

            </form>
        </div>
    </div>
</main>
{% endblock %}
