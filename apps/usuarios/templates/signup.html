{% extends "base.html" %}

{% block content %}
<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="w-full md:w-1/3 mt-12">
            <form action="/signup/" method="POST" class="bg-white p-6 rounded-lg shadow-md">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Create User</h1>

                {% if error %}
                <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    {{ error }}
                </div>
                {% endif %}

                {% csrf_token %}

                <div class="mb-4">
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">
                        Username
                        <span
                            class="ml-1 text-gray-400"
                            data-bs-toggle="tooltip"
                            title="Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only."
                            style="cursor: help;"
                        >?</span>
                    </label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Type your username"
                    >
                </div>

                <div class="mb-4">
                    <label for="password1" class="block text-gray-700 text-sm font-bold mb-2">Password:</label>
                    <input type="password" name="password1" id="password1"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Type your password">
                </div>

                <div class="mb-6">
                    <label for="password2" class="block text-gray-700 text-sm font-bold mb-2">
                        Confirm your password
                        <span
                            class="ml-1 text-gray-400"
                            data-bs-toggle="tooltip"
                            data-bs-html="true"
                            title="Requirements:<br>- Enter the same password as before.<br>- Not similar to personal info.<br>- At least 8 characters.<br>- Not a common password.<br>- Not entirely numeric."
                            style="cursor: help;"
                        >?</span>
                    </label>
                    <input
                        type="password"
                        name="password2"
                        id="password2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Confirm your password"
                    >
                </div>

                <button type="submit" class="w-full bg-gray-800 text-white py-2 px-4 rounded-lg hover:bg-gray-700 transition-colors font-medium">
                    Create Account
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}

{% block extra_js %}
{% endblock %}
