{% extends "base.html" %}

{% block content %}
<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="w-full md:w-1/3 mt-12">
            <form action="/signup/" method="POST" class="bg-white p-6 rounded-lg shadow-md">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Crear Usuario</h1>

                {% if error %}
                <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    {{ error }}
                </div>
                {% endif %}

                {% csrf_token %}

                <div class="mb-4">
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">
                        Nombre de usuario
                        <span
                            class="ml-1 text-gray-500"
                            data-bs-toggle="tooltip"
                            title="Obligatorio. 150 caracteres o menos. Letras, digitos y @/./+/-/_ solamente."
                            style="cursor: help;"
                        >?</span>
                    </label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Ingrese su nombre de usuario"
                        required
                        maxlength="150"
                        minlength="3"
                    >
                </div>

                <div class="mb-4">
                    <label for="password1" class="block text-gray-700 text-sm font-bold mb-2">Contrase&ntilde;a:</label>
                    <input type="password" name="password1" id="password1"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Ingrese su contrase&ntilde;a"
                        required
                        minlength="8">
                </div>

                <div class="mb-6">
                    <label for="password2" class="block text-gray-700 text-sm font-bold mb-2">
                        Confirmar contrase&ntilde;a
                        <span
                            class="ml-1 text-gray-500"
                            data-bs-toggle="tooltip"
                            data-bs-html="true"
                            title="Requisitos:<br>- Ingrese la misma contrase&ntilde;a.<br>- No similar a datos personales.<br>- Al menos 8 caracteres.<br>- No sea com&uacute;n.<br>- No sea completamente num&eacute;rica."
                            style="cursor: help;"
                        >?</span>
                    </label>
                    <input
                        type="password"
                        name="password2"
                        id="password2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Confirme su contrase&ntilde;a"
                        required
                        minlength="8"
                    >
                </div>

                <button type="submit" class="w-full bg-gray-800 text-white py-2 px-4 rounded-lg hover:bg-gray-700 transition-colors font-medium"
                    onclick="this.disabled=true; this.form.submit();">
                    Crear Cuenta
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}

{% block extra_js %}
{% endblock %}
