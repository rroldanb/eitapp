{% extends "base.html" %}

{% block content %}
<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="w-full md:w-1/3 mt-12">
            <form method="POST" class="bg-white p-6 rounded-lg shadow-md">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Crear Usuario</h1>

                {% if error %}
                <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    {{ error }}
                </div>
                {% endif %}

                {% csrf_token %}

                <div class="mb-4">
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Nombre de usuario</label>
                    <input type="text" name="username" id="username"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Nombre de usuario" required maxlength="150">
                </div>

                <div class="mb-4">
                    <label for="password1" class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                    <input type="password" name="password1" id="password1"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Contraseña" required minlength="8">
                </div>

                <div class="mb-4">
                    <label for="password2" class="block text-gray-700 text-sm font-bold mb-2">Confirmar contraseña</label>
                    <input type="password" name="password2" id="password2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Confirmar contraseña" required minlength="8">
                </div>

                <div class="mb-4">
                    <label for="role" class="block text-gray-700 text-sm font-bold mb-2">Rol</label>
                    <select name="role" id="role"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="10">Encuestador</option>
                        <option value="20">Modelador</option>
                        <option value="30">Admin</option>
                    </select>
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors font-medium"
                    onclick="this.disabled=true; this.form.submit();">
                    <i class="fas fa-user-plus mr-1" aria-hidden="true"></i>
                    Crear Usuario
                </button>

                <div class="mt-4 text-center">
                    <a href="{% url 'home' %}" class="text-sm text-gray-500 hover:text-gray-700">
                        <i class="fas fa-arrow-left mr-1" aria-hidden="true"></i>
                        Volver al inicio
                    </a>
                </div>
            </form>

            {% if success %}
            <div class="mt-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg text-center">
                <i class="fas fa-check-circle mr-1" aria-hidden="true"></i>
                Usuario creado exitosamente.
            </div>
            {% endif %}
        </div>
    </div>
</main>
{% endblock %}
