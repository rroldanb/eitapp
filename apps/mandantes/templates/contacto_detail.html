{% extends "base.html" %}

{% block content %}

<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="mt-12 bg-gray-100 p-6 rounded-lg shadow-md w-full sm:max-w-2xl">

            <h1 class="text-center text-3xl font-bold bg-gradient-primary text-white py-4 px-6 rounded-lg mb-6">Detalles del Contacto</h1>
            <h2 class="text-center text-xl font-semibold text-green-600 mb-4">{{ contacto.name }}</h2>

            {% if error %}
            <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                {{ form }}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <button type="submit" class="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium"
                        onclick="this.disabled=true; this.form.submit();">
                        Actualizar
                    </button>
                    <a href="{% url 'mandante_detail' contacto.mandante.id %}" class="w-full text-center px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-medium">
                        Volver
                    </a>
                </div>
            </form>

            <form action="{% url 'contacto_delete' contacto.id %}" method="POST" class="mt-2">
                {% csrf_token %}
                <button type="submit" class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium"
                    onclick="this.disabled=true; this.form.submit();">
                    Eliminar
                </button>
            </form>

        </div>
    </div>
</main>

{% endblock %}
