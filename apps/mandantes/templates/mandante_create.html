{% extends "base.html" %}

{% block content %}

<div class="container mx-auto mt-4 p-6 bg-white rounded-lg shadow-md max-w-2xl">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Nuevo Mandante</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="flex justify-center mt-4 space-x-3">
            <button type="submit" class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition-colors font-medium">
                Guardar
            </button>
            <a href="{% url 'mandantes' %}" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-medium">
                Volver
            </a>
        </div>
    </form>
</div>

{% endblock %}
