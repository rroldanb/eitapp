{% extends "base.html" %}

{% block content %}

<main class="container mx-auto px-4 py-8">
    <div class="flex justify-center">
        <div class="mt-12 bg-gray-100 p-6 rounded-lg shadow-md w-full sm:max-w-2xl">
            <h1 class="text-center text-3xl font-bold bg-gradient-primary text-white py-4 px-6 rounded-lg mb-6">
                Nuevo Contacto
            </h1>

            <form method="post" class="space-y-4">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="flex flex-col sm:flex-row justify-center mt-4 space-y-2 sm:space-y-0 sm:space-x-3">
                    <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium"
                        onclick="this.disabled=true; this.form.submit();">
                        Guardar
                    </button>
                    <a href="{% url 'mandante_detail' mandante.id %}" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-medium">
                        Volver
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

{% endblock %}
