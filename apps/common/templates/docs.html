{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css" integrity="sha512-h/0Q5kEH38cy4mHjDl2Ym5/UFMGCk0Mb3J5MnE4/VpYRlQ3BiZbYFK+HDYl13ENL1SRy3HCXIr2aEKaVQkELMQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-4xl">
  <div class="rounded-lg border border-gray-200 bg-white shadow-sm">
    <div class="px-6 py-3 border-b border-gray-200 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-base font-semibold text-gray-800">
          <i class="far fa-file-alt mr-2 text-gray-500"></i>README.md
        </span>
        <div class="flex items-center gap-1 ml-3 pl-3 border-l border-gray-200">
          <a href="{% url 'docs' %}" class="px-2 py-0.5 text-xs rounded no-underline {% if not lang or lang == 'es' %}bg-indigo-100 text-indigo-700{% else %}text-gray-500 hover:text-gray-700{% endif %}">ES</a>
          <a href="{% url 'docs_lang' 'en' %}" class="px-2 py-0.5 text-xs rounded no-underline {% if lang == 'en' %}bg-indigo-100 text-indigo-700{% else %}text-gray-500 hover:text-gray-700{% endif %}">EN</a>
          <a href="{% url 'docs_lang' 'pt' %}" class="px-2 py-0.5 text-xs rounded no-underline {% if lang == 'pt' %}bg-indigo-100 text-indigo-700{% else %}text-gray-500 hover:text-gray-700{% endif %}">PT</a>
        </div>
      </div>
      <a href="{% url 'home' %}" class="text-sm text-gray-500 hover:text-gray-700 no-underline">
        <i class="fas fa-arrow-left mr-1"></i>Dashboard
      </a>
    </div>
    <div class="markdown-body px-8 py-6" style="box-sizing: border-box;">
      {{ content }}
    </div>
  </div>
</div>
{% endblock %}
