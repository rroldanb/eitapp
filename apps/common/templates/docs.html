{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css" integrity="sha512-E98C4d6uQYwHN6W36f44S3tVQCkmRIG/1FStjFI7ePeL4UEW4jFK6fHX8XRBZbqh/XmF9AN4JP7V/Gj3SAzL1A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-4xl">
  <div class="rounded-lg border shadow-sm" style="background-color: #0d1117; border-color: #30363d;">
    <div class="px-6 py-3 border-b flex items-center justify-between" style="border-color: #30363d;">
      <div class="flex items-center gap-3">
        <span class="text-base font-semibold" style="color: #e6edf3;">
          <i class="far fa-file-alt mr-2" style="color: #8b949e;"></i>README.md
        </span>
        <div class="flex items-center gap-1 ml-3 pl-3 border-l" style="border-color: #30363d;">
          <a href="{% url 'docs' %}" class="px-2 py-0.5 text-xs rounded no-underline {% if not lang or lang == 'es' %}{% endif %}" style="{% if not lang or lang == 'es' %}background-color: rgba(56,139,253,0.15); color: #58a6ff;{% else %}color: #8b949e;{% endif %}">ES</a>
          <a href="{% url 'docs_lang' 'en' %}" class="px-2 py-0.5 text-xs rounded no-underline" style="{% if lang == 'en' %}background-color: rgba(56,139,253,0.15); color: #58a6ff;{% else %}color: #8b949e;{% endif %}">EN</a>
          <a href="{% url 'docs_lang' 'pt' %}" class="px-2 py-0.5 text-xs rounded no-underline" style="{% if lang == 'pt' %}background-color: rgba(56,139,253,0.15); color: #58a6ff;{% else %}color: #8b949e;{% endif %}">PT</a>
        </div>
      </div>
      <a href="{% url 'home' %}" class="text-xs no-underline" style="color: #58a6ff;">
        <i class="fas fa-arrow-left mr-1"></i>Dashboard
      </a>
    </div>
    <div class="markdown-body px-8 py-6" style="box-sizing: border-box;">
      {{ content }}
    </div>
  </div>
</div>
{% endblock %}
