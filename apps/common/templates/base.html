{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIT_App</title>


    <!-- Tailwind CSS -->
    {% comment %} <script src="https://cdn.tailwindcss.com"></script> {% endcomment %}

    {% load static tailwind_tags %}
    {% tailwind_css %}

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/2aaa0bfb6c.js" crossorigin="anonymous" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/hyperscript.org@0.9.91/dist/_hyperscript.min.js" integrity="sha384-OT9bNmUa5rM34SmxFpRftn2F6GbgM/4xnTmn0z106OE5uvsigkdtUMOpdPKOigyO" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous" defer></script>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/2.4.2/openseadragon.min.js" defer fetchpriority="low"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer fetchpriority="low"></script>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <!-- Core modules (always loaded) -->
    <script src="{% static 'js/core/toast.js' %}" defer></script>
    <script src="{% static 'js/core/modal.js' %}" defer></script>
    <script src="{% static 'js/dropdown_handler.js' %}" defer></script>
</head>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <header>

        {% block mainnavbar %}
        {% include "navbar.html" %}
        {% endblock %}

    </header>

    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-indigo-600 focus:text-white focus:rounded focus:shadow-lg">
      Saltar al contenido principal
    </a>

    <main id="main-content">
        {% load static %}

        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}
    {% endblock %}



</body>
</html>
