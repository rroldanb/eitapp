{% block mainnavbar %}

<nav class="bg-gray-900 text-white px-4 py-3 shadow-lg">
    <div class="container mx-auto flex items-center justify-between">
        <!-- Brand -->
        <a href="{% url 'home' %}" class="text-xl font-bold text-white hover:text-gray-200 transition-colors">
            EITApp
        </a>

        <!-- Mobile toggle button (Bootstrap) -->
        <button class="lg:hidden p-2 rounded hover:bg-gray-700 transition-colors" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarNav" 
                aria-controls="navbarNav" 
                aria-expanded="false" 
                aria-label="Toggle navigation">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>

        <!-- Nav links -->
        <div class="hidden lg:flex items-center space-x-6" id="navbarNav">
            <ul class="flex items-center space-x-4 ml-auto">
                <!-- Home -->
                <li class="list-none">
                    <a href="/" class="text-gray-300 hover:text-white px-3 py-2 rounded transition-colors {% if request.path == '/' %}bg-gray-800 text-white{% endif %}">
                        Home
                    </a>
                </li>

                {% if user.is_authenticated %}
                    <!-- Proyectos -->
                    <li class="list-none">
                        <a href="{% url 'proyectos' %}" class="text-gray-300 hover:text-white px-3 py-2 rounded transition-colors {% if request.resolver_match.url_name == 'proyectos' %}bg-gray-800 text-white{% endif %}">
                            Proyectos
                        </a>
                    </li>

                    <!-- Mandantes Dropdown -->
                    <li class="list-none relative">
                        {% include "common/navbar/mandantes_dropdown.html" %}
                    </li>

                    <!-- Tasks Dropdown -->
                    <li class="list-none relative">
                        {% include "common/navbar/tasks_dropdown.html" %}
                    </li>

                    <!-- Logout -->
                    <li class="list-none">
                        <a href="{% url 'signout' %}" class="text-gray-300 hover:text-white px-3 py-2 rounded transition-colors ml-4">
                            Logout
                        </a>
                    </li>
                {% else %}
                    <!-- Register -->
                    <li class="list-none">
                        <a href="{% url 'signup' %}" class="text-gray-300 hover:text-white px-3 py-2 rounded transition-colors {% if request.path == '/signup/' %}bg-gray-800 text-white{% endif %}">
                            Register
                        </a>
                    </li>
                    <!-- Login -->
                    <li class="list-none">
                        <a href="{% url 'signin' %}" class="text-gray-300 hover:text-white px-3 py-2 rounded transition-colors {% if request.path == '/signin/' %}bg-gray-800 text-white{% endif %}">
                            Login
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

{% endblock %}
