<tr id="punto-control-row-{{ item.id }}" class="punto-control-row hover:bg-gray-50" data-pc-id="{{ item.id }}">
  <td class="px-1 py-1">
    <select name="nodo" aria-label="Nodo" class="px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
      {% for v, l in form.nodo.field.choices %}
        <option value="{{ v }}" {% if item.nodo.pk == v %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="px-1 py-1">
    <select name="movimiento" aria-label="Movimiento" class="px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
      <option value="" {% if not item.movimiento %}selected{% endif %}>---</option>
      {% for v, l in form.movimiento.field.choices %}
        <option value="{{ v }}" {% if item.movimiento == v %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="px-1 py-1">
    <select name="viraje" aria-label="Viraje" class="px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
      <option value="" {% if not item.viraje %}selected{% endif %}>---</option>
      {% for v, l in form.viraje.field.choices %}
        <option value="{{ v }}" {% if item.viraje == v %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="px-1 py-1 text-center">
    <input type="checkbox" name="is_prioritario" id="pc-prioritario-{{ item.id }}" class="mr-1" aria-label="Es prioritario" {% if item.is_prioritario %}checked{% endif %}>
  </td>
  <td class="px-1 py-1">
    <select name="arco_entrada" aria-label="Arco de entrada" class="px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
      {% for v, l in form.arco_entrada.field.choices %}
        <option value="{{ v }}" {% if item.arco_entrada.pk == v %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="px-1 py-1">
    <select name="arco_salida" aria-label="Arco de salida" class="px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
      {% for v, l in form.arco_salida.field.choices %}
        <option value="{{ v }}" {% if item.arco_salida.pk == v %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="px-1 py-1 w-max-8">
    <select name="regulacion" aria-label="Regulación" class="w-max-8 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
      <option value="" {% if not item.regulacion_id %}selected{% endif %}>---</option>
      {% for v, l in form.regulacion.field.choices %}
        <option value="{{ v }}" {% if item.regulacion.pk == v %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="px-1 py-1">
    <input type="number" name="numero_pistas" id="pc-pistas-{{ item.id }}" aria-label="Número de pistas" class="w-16 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" step="0.5" value="{{ item.numero_pistas|default:'' }}">
  </td>
  <td class="px-1 py-1 flex gap-1">
    <button type="button" class="px-2 py-1 text-xs border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors action-btn"
      hx-put="{% url 'punto_control_update' item.id %}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML transition:true swap:1s"
      hx-indicator="#save-indicator-{{ item.id }}"
      aria-label="Guardar punto de control"
    >
      <span id="save-indicator-{{ item.id }}" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin mr-1 htmx-indicator" style="display: none;"></span>
      OK
    </button>
    <button type="button" class="px-2 py-1 text-xs border border-red-600 text-red-600 rounded hover:bg-red-600 hover:text-white transition-colors action-btn"
      hx-delete="{% url 'punto_control_delete' item.id %}"
      hx-target="closest tr"
      hx-swap="outerHTML transition:true swap:1s"
      hx-indicator="#delete-indicator-{{ item.id }}"
      aria-label="Eliminar punto de control"
    >
      <span id="delete-indicator-{{ item.id }}" class="inline-block w-3 h-3 border-2 border-t-transparent border-red-600 rounded-full animate-spin mr-1 htmx-indicator" style="display: none;"></span>
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </td>
</tr>
