{% load l10n %}
<tr id="fase-semaforica-row-{{ item.id }}" class="fase-semaforica-row hover:bg-gray-50" data-fase-id="{{ item.id }}">
  <td class="px-2 py-1 whitespace-nowrap font-medium text-gray-700 max-w-48 truncate" title="{{ item.punto_control.nombre }}">{{ item.punto_control.nombre }}<input type="hidden" name="punto_control" value="{{ item.punto_control_id }}"></td>
  <td class="px-2 py-1 whitespace-nowrap text-gray-600">{{ item.punto_control.get_movimiento_display|default:item.punto_control.movimiento }}</td>
  <td class="px-2 py-1 whitespace-nowrap text-center editable-field" data-field="fase_numero">
    <span class="field-display"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ item.id }}">
      {{ item.fase_numero }}
    </span>
    <input type="number" name="fase_numero" value="{{ item.fase_numero }}"
      class="field-input hidden w-16 px-2 py-1 border border-gray-300 rounded text-sm text-center focus:ring-2 focus:ring-indigo-500" min="1"
      _="on keydown[key == 'Enter']
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ item.id }}">
  </td>
  <td class="px-2 py-1 whitespace-nowrap editable-field" data-field="verde_inicio">
    <span class="field-display"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ item.id }}">
      {{ item.verde_inicio }}
    </span>
    <input type="number" name="verde_inicio" value="{{ item.verde_inicio }}"
      class="field-input hidden w-20 px-2 py-1 border border-gray-300 rounded text-sm text-right focus:ring-2 focus:ring-indigo-500" step="0.1"
      _="on keydown[key == 'Enter']
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ item.id }}">
  </td>
  <td class="px-2 py-1 whitespace-nowrap editable-field" data-field="verde_fin">
    <span class="field-display"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ item.id }}">
      {{ item.verde_fin }}
    </span>
    <input type="number" name="verde_fin" value="{{ item.verde_fin }}"
      class="field-input hidden w-20 px-2 py-1 border border-gray-300 rounded text-sm text-right focus:ring-2 focus:ring-indigo-500" step="0.1"
      _="on keydown[key == 'Enter']
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ item.id }}">
  </td>
  <td class="px-2 py-1 flex gap-1 whitespace-nowrap">
    <button type="button"
      id="save-row-btn-{{ item.id }}"
      aria-label="Guardar fase semafórica"
      class="save-row-btn hidden px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors"
      hx-put="{% url 'fase_semaforica_update' item.id %}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML">
      Guardar
    </button>
    <button type="button"
      aria-label="Eliminar fase semafórica"
      class="px-3 py-1 text-sm border border-red-600 text-red-600 rounded hover:bg-red-600 hover:text-white transition-colors"
      hx-delete="{% url 'fase_semaforica_delete' item.id %}"
      hx-target="closest tr"
      hx-swap="outerHTML"
      hx-confirm="Eliminar fase {{ item.fase_numero }} de {{ item.punto_control.nombre }}?">
      Eliminar
    </button>
  </td>
</tr>
