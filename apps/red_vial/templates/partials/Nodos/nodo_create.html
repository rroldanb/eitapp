


<tr id="new-nodo-form-row" class=""> 
  <td colspan="5" class="px-0 py-1 ">
    <form id="new-nodo-form"
    class="bg-slate-100/50 border"

      data-action="create"
      hx-post="{% url 'nodo_create' proyecto.id %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      <div class="flex flex-wrap items-center justify-around   rounded">
        
        <input type="number" id="new_number" name="numero" 
          class="form-control py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 ml-0"
          value="{{ proyecto.nodos.count|add:1 }}" min="1" max="999"/>

        <select class="form-control py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 focus:border-transparent" name="calle_1">
          <option value="">Seleccionar calle...</option>
          {% for calle in proyecto.calles.all %}
          <option value="{{ calle.id }}">{{ calle.nombre }}</option>
          {% endfor %}
        </select>

        <select class="form-control py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 focus:border-transparent" name="calle_2">
          <option value="">Seleccionar calle...</option>
          {% for calle in proyecto.calles.all %}
          <option value="{{ calle.id }}">{{ calle.nombre }}</option>
          {% endfor %}
        </select>

        <div class="form-control flex items-center gap-2">
          <input class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" type="checkbox" name="is_pc" id="is_pc_new">
          <input type="number" id="numero_pc" name="numero_pc" class="w-16 px-2 py-1 border border-gray-300 rounded text-sm" placeholder="N°" min="1" max="99" />
        </div>

        <button type="submit" class="px-1 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors" data-action="create">
          Guardar
        </button>

        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin htmx-indicator" style="display:none;" role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
