


<tr id="new-nodo-form-row"> 
  <td colspan="6" class="px-2 py-3 {% if form.errors %}bg-red-50{% else %}bg-green-100{% endif %}">
    <form id="new-nodo-form"
      data-action="create"
      hx-post="{% url 'nodo_create' proyecto.id %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      {% if form.errors %}
      <div class="mb-2 space-y-1">
        {% for field in form %}
          {% for error in field.errors %}
            <p class="text-red-600 text-xs error-message">{{ field.label }}: {{ error }}</p>
          {% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}
          <p class="text-red-600 text-xs error-message">{{ error }}</p>
        {% endfor %}
      </div>
      {% endif %}
      <div class="flex flex-wrap items-center gap-4 justify-center">
        
        <input type="number" id="new_number" name="numero" aria-label="Número de nodo"
          class="w-16 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 bg-slate-50"
          value="{{ proyecto.nodos.count|add:1 }}" min="1" max="999"/>

        <select class="px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 bg-slate-50" name="calle_1" aria-label="Calle 1">
          <option value="">Calle 1...</option>
          {% for calle in proyecto.calles.all %}
          <option value="{{ calle.id }}">{{ calle.nombre }}</option>
          {% endfor %}
        </select>

        <select class="px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 bg-slate-50" name="calle_2" aria-label="Calle 2">
          <option value="">Calle 2...</option>
          {% for calle in proyecto.calles.all %}
          <option value="{{ calle.id }}">{{ calle.nombre }}</option>
          {% endfor %}
        </select>

        <div class="flex items-center gap-1">
          <label class="text-xs text-gray-600  whitespace-nowrap">PC N°</label>
          <input type="number" name="numero_pc" aria-label="Número de punto de control" class="w-14 bg-gray-100 px-1 py-1 border border-gray-300 rounded text-xs" placeholder="N°" min="1" max="99" />
        </div>

        <button type="submit" class="px-2 py-1 text-xs border border-blue-600 text-blue-600 rounded hover:bg-blue-600 hover:text-white transition-colors action-btn" data-action="create">
          Crear
        </button>

        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-blue-600 rounded-full animate-spin mr-1 htmx-indicator" style="display:none;" role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
