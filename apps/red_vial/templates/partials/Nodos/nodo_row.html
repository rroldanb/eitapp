<tr id="nodo-row-{{ nodo.id }}" class="nodo-row hover:bg-gray-50" data-nodo-id="{{ nodo.id }}">

  <td class="px-2 py-1 editable-field" data-field="numero">
    <span class="field-display"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ nodo.id }}">
      {{ nodo.numero }}
    </span>
    <input type="number" name="numero" value="{{ nodo.numero }}"
      class="field-input hidden w-16 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" min="1" max="99"
      _="on keydown[key == 'Enter']
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ nodo.id }}">
  </td>

  <td class="px-2 py-1 editable-field" data-field="calle_1">
    <span class="field-display"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        remove .hidden from #save-row-btn-{{ nodo.id }}">
      {{ nodo.calle_1.nombre|default:'—' }}
    </span>
    <select name="calle_1" aria-label="Calle 1"
      class="field-input hidden w-full px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500"
      _="on change
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ nodo.id }}">
      <option value="">—</option>
      {% for calle in calles %}
      <option value="{{ calle.id }}" {% if nodo.calle_1_id == calle.id %}selected{% endif %}>{{ calle.nombre }}</option>
      {% endfor %}
    </select>
  </td>

  <td class="px-2 py-1 editable-field" data-field="calle_2">
    <span class="field-display"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        remove .hidden from #save-row-btn-{{ nodo.id }}">
      {{ nodo.calle_2.nombre|default:'—' }}
    </span>
    <select name="calle_2" aria-label="Calle 2"
      class="field-input hidden w-full px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500"
      _="on change
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ nodo.id }}">
      <option value="">—</option>
      {% for calle in calles %}
      <option value="{{ calle.id }}" {% if nodo.calle_2_id == calle.id %}selected{% endif %}>{{ calle.nombre }}</option>
      {% endfor %}
    </select>
  </td>

  <td class="px-2 py-1 editable-field" data-field="numero_pc">
    <div class="flex items-center gap-1">
      {% if nodo.is_pc %}
      <span class="field-display"
        _="on click
          add .hidden to me
          remove .hidden from next .field-input
          call me.nextElementSibling.focus()
          remove .hidden from #save-row-btn-{{ nodo.id }}">
        PC-{{ nodo.numero_pc|stringformat:'02d' }}
      </span>
      {% else %}
      <span class="field-display text-gray-400"
        _="on click
          add .hidden to me
          remove .hidden from next .field-input
          call me.nextElementSibling.focus()
          remove .hidden from #save-row-btn-{{ nodo.id }}">
        —
      </span>
      {% endif %}
      <input type="number" name="numero_pc" value="{{ nodo.numero_pc|default:'' }}"
        class="field-input hidden w-16 px-2 py-1 border border-gray-300 rounded text-sm" min="1" max="99"
        _="on keydown[key == 'Enter']
          add .hidden to me
          remove .hidden from previous .field-display
          trigger click on #save-row-btn-{{ nodo.id }}">
    </div>
  </td>

  <td class="px-2 py-1 text-center">
    <div class="flex items-center justify-center gap-1">
      <button type="button" onclick="openNodoFileModal('{{ nodo.id }}', 'imagen', '{% if nodo.imagen %}{{ nodo.imagen|escapejs }}{% endif %}', '{% if nodo.plano %}{{ nodo.plano|escapejs }}{% endif %}')"
        class="inline-flex items-center justify-center w-9 h-9 rounded-full transition-colors
        {% if nodo.imagen %}bg-green-100 text-green-600 hover:bg-green-200{% else %}bg-gray-100 text-gray-400 hover:bg-gray-200{% endif %}"
        title="{% if nodo.imagen %}Gestionar imagen (mapa){% else %}Agregar imagen (mapa){% endif %}">
        <i class="{% if nodo.imagen %}fas{% else %}far{% endif %} fa-map text-sm"></i>
      </button>
      <button type="button" onclick="openNodoFileModal('{{ nodo.id }}', 'plano', '{% if nodo.imagen %}{{ nodo.imagen|escapejs }}{% endif %}', '{% if nodo.plano %}{{ nodo.plano|escapejs }}{% endif %}')"
        class="inline-flex items-center justify-center w-9 h-9 rounded-full transition-colors
        {% if nodo.plano %}bg-green-100 text-green-600 hover:bg-green-200{% else %}bg-gray-100 text-gray-400 hover:bg-gray-200{% endif %}"
        title="{% if nodo.plano %}Gestionar plano (esquema){% else %}Agregar plano (esquema){% endif %}">
        <i class="{% if nodo.plano %}fas{% else %}far{% endif %} fa-draw-polygon text-sm"></i>
      </button>
    </div>
  </td>

  <td class="px-2 py-1 flex gap-1">
    <button type="button"
      id="save-row-btn-{{ nodo.id }}"
      aria-label="Guardar nodo"
      class="save-row-btn hidden px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors"
      hx-put="{% url 'nodo_update' nodo.id %}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML">
      Guardar
    </button>
    <button type="button"
      aria-label="Eliminar nodo"
      class="px-3 py-1 text-sm border border-red-600 text-red-600 rounded hover:bg-red-600 hover:text-white transition-colors"
      hx-delete="{% url 'nodo_delete' nodo.id %}"
      hx-target="closest tr"
      hx-swap="outerHTML"
      >
      Eliminar
    </button>
  </td>

</tr>
