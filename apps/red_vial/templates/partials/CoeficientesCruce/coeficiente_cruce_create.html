<tr id="new-coeficiente-cruce-form-row">
  <td colspan="6" class="px-4 py-3">
    <form id="new-coeficiente-cruce-form"
      data-action="create"
      hx-post="{% url 'coeficiente_cruce_create' %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      <div class="flex flex-wrap items-center gap-2">
        {{ form.nomenclatura }}
        {{ form.tipo_transporte }}
        {{ form.coeficiente }}
        <label class="flex items-center gap-1 text-sm whitespace-nowrap">
          {{ form.is_standard }} Estándar
        </label>
        {{ form.proyecto }}
        <button type="submit" class="px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors">
          Guardar
        </button>
        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin htmx-indicator" style="display:none;"></span>
      </div>
    </form>
  </td>
</tr>
