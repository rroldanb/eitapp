<tr id="new-coeficiente-cruce-form-row">
  <td colspan="6" class="px-4 py-3">
    <form id="new-coeficiente-cruce-form" data-action="create"
      hx-post="{% url 'coeficiente_cruce_create' %}"
      hx-target="closest tr" hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator">
      {% csrf_token %}
      <div class="flex flex-wrap items-center gap-3">
        <select name="nomenclatura" id="create-nomenclatura"
          class="w-24 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 uppercase text-sm" required>
          <option value="">— Nomenclatura —</option>
          {% for sc in standard_coeficientes %}
            <option value="{{ sc.nomenclatura }}" data-desc="{{ sc.tipo_transporte }}">{{ sc.nomenclatura }}</option>
          {% endfor %}
        </select>
        <input type="text" name="tipo_transporte" id="create-tipo-transporte"
          class="form-control flex-1 min-w-[220px] max-w-2/3 px-3 py-2 border border-gray-300 rounded bg-gray-100 focus:ring-2 focus:ring-indigo-500"
          placeholder="Tipo de transporte" readonly required />
        <input type="number" name="coeficiente" step="0.01"
          class="w-24 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500"
          placeholder="1.0" required />
        <select name="proyecto"
          class="px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 text-sm" required>
          <option value="">— Proyecto —</option>
          {% for p in available_projects %}
            <option value="{{ p.id }}">{{ p.title }}</option>
          {% endfor %}
        </select>
        <button type="submit" class="px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors" data-action="create">
          Guardar
        </button>
        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin htmx-indicator" style="display:none;" role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
<script>
  document.getElementById('create-nomenclatura')?.addEventListener('change', function() {
    var desc = this.options[this.selectedIndex]?.dataset.desc || '';
    document.getElementById('create-tipo-transporte').value = desc;
  });
</script>
