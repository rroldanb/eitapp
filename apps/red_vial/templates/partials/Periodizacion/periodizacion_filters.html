<form id="periodizacion-filters"
  hx-get="{% url 'periodizacion_list' proyecto.id %}"
  hx-target="#periodizacion-container"
  hx-swap="outerHTML"
  hx-push-url="true"
  hx-trigger="change from:.filter-checkbox delay:200ms, change from:select[name=fecha]"
  hx-sync="this:replace"
  class="bg-slate-200 rounded-lg mb-4">

  <div class="flex items-center justify-between px-4 py-2 cursor-pointer select-none border-b border-slate-300"
    _="on click toggle .hidden on #periodizacion-filter-body">
    <span class="text-sm font-bold text-gray-700">Filtros</span>
    <i class="fas fa-chevron-down text-xs text-gray-500 transition-transform" aria-hidden="true"
      _="on click toggle .rotate-180 on me"></i>
  </div>

  <div id="periodizacion-filter-body" class="p-4">
  <div class="grid grid-cols-3 gap-4">
    {# Col 1: PC(s) + Nueva fecha #}
    <div class="flex flex-col gap-4">
      <div class="filter-group">
        <div class="flex justify-between items-center mb-2">
          <label class="font-bold text-sm text-gray-700">PC(s)</label>
          <button type="button" class="text-xs text-indigo-600 hover:text-indigo-800"
            _="on click
              set checkboxes to my.closest('.filter-group').querySelectorAll('.filter-checkbox')
              repeat for el in checkboxes
                set el.checked to true
              end
              if checkboxes.length > 0
                trigger change on checkboxes[0]">
            Todos
          </button>
        </div>
        <div class="max-h-40 overflow-y-auto space-y-1 bg-slate-50">
          {% for nodo in available_nodos %}
          <label class="flex items-center gap-1.5 text-sm cursor-pointer hover:bg-slate-100 px-1 rounded min-w-0 overflow-hidden">
            <input type="checkbox" name="nodo" value="{{ nodo.id }}" class="filter-checkbox shrink-0"
              {% if nodo.id|stringformat:"s" in selected_nodos %}checked{% endif %}>
            <span class="truncate">PC-{{ nodo.numero_pc|stringformat:"02d" }} - {{ nodo.calle_1.nombre|default:"" }} / {{ nodo.calle_2.nombre|default:"" }}</span>
          </label>
          {% endfor %}
        </div>
      </div>
      <div>
        <label class="text-xs text-gray-600 font-medium">Nueva fecha:</label>
        <input type="date" id="fecha-generar-input" name="fecha_generar"
          class="w-full mt-1 px-2 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-white">
      </div>
    </div>

    {# Col 2: Movimiento(s) #}
    <div class="filter-group">
      <div class="flex justify-between items-center mb-2">
        <label class="font-bold text-sm text-gray-700">Movimiento(s)</label>
        <button type="button" class="text-xs text-indigo-600 hover:text-indigo-800"
          _="on click
            set checkboxes to my.closest('.filter-group').querySelectorAll('.filter-checkbox')
            repeat for el in checkboxes
              set el.checked to true
            end
            if checkboxes.length > 0
              trigger change on checkboxes[0]">
          Todos
        </button>
      </div>
      <div class="max-h-40 overflow-y-auto space-y-1 bg-slate-50">
        {% for mov in available_movimientos %}
        <label class="flex items-center gap-1.5 text-sm cursor-pointer hover:bg-slate-100 px-1 rounded">
          <input type="checkbox" name="movimiento" value="{{ mov.value }}" class="filter-checkbox"
            {% if mov.value in selected_movimientos %}checked{% endif %}>
          {{ mov.label }}
        </label>
        {% empty %}
        <span class="text-gray-500 text-xs">Selecciona PC(s)</span>
        {% endfor %}
      </div>
    </div>

    {# Col 3: Periodo(s) + Fecha + Acciones #}
    <div class="flex flex-col gap-4">
      <div class="filter-group">
        <div class="flex justify-between items-center mb-2">
          <label class="font-bold text-sm text-gray-700">Periodo(s)</label>
          <button type="button" class="text-xs text-indigo-600 hover:text-indigo-800"
            _="on click
              set checkboxes to my.closest('.filter-group').querySelectorAll('.filter-checkbox')
              repeat for el in checkboxes
                set el.checked to true
              end
              if checkboxes.length > 0
                trigger change on checkboxes[0]">
            Todos
          </button>
        </div>
        <div class="max-h-40 overflow-y-auto space-y-1 bg-slate-50">
          {% for p in available_periodos %}
          <label class="flex items-center gap-1.5 text-sm cursor-pointer hover:bg-slate-100 px-1 rounded">
            <input type="checkbox" name="periodo" value="{{ p.id }}" class="filter-checkbox"
              {% if p.id|stringformat:"s" in selected_periodos %}checked{% endif %}>
            {{ p.codigo }} ({{ p.hora_inicio|time:"H:i" }}-{{ p.hora_fin|time:"H:i" }})
          </label>
          {% endfor %}
        </div>
      </div>
      <div>
        <label class="font-bold text-sm text-gray-700 block mb-2">Fecha</label>
        <select name="fecha"
          class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-white">
          <option value="">Todas las fechas</option>
          {% for f in available_fechas %}
          <option value="{{ f|date:'Y-m-d' }}" {% if selected_fecha == f|date:'Y-m-d' %}selected{% endif %}>{{ f|date:'d/m/Y' }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex justify-end items-center gap-2 mt-auto">
        <a href="{% url 'periodizacion_list' proyecto.id %}"
          class="px-3 py-1.5 bg-gray-200 text-gray-700 text-sm rounded hover:bg-gray-300 transition-colors">
          Limpiar
        </a>
        <button type="button"
          class="px-3 py-1.5 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition-colors"
          hx-post="{% url 'periodizacion_generar' proyecto.id %}"
          hx-include="#periodizacion-filters, #fecha-generar-input"
          hx-target="#periodizacion-container"
          hx-swap="outerHTML"
          hx-confirm="¿Generar filas para las selecciones actuales?"
          hx-indicator="#generar-indicator">
          <span id="generar-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-white rounded-full animate-spin mr-1 htmx-indicator" style="display: none;"></span>
          Generar filas
        </button>
      </div>
    </div>
  </div>
  </div>
</form>
