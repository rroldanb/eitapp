<div id="periodizacion-container">
  {% if generated_count %}
  <div id="generation-toast" class="fixed top-4 right-4 z-50 bg-green-500 text-white px-4 py-2 rounded shadow-lg text-sm animate-fade-in-down">
    Se generaron {{ generated_count }} filas
  </div>
  <script>
    setTimeout(function() {
      var el = document.getElementById('generation-toast');
      if (el) el.remove();
    }, 3000);
  </script>
  {% endif %}

  {% include 'partials/Periodizacion/periodizacion_filters.html' %}

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <div class="p-4">
      {% include 'partials/Periodizacion/periodizacion_table.html' %}
    </div>
  </div>

  <div id="periodizacion-list-config" data-proyecto-id="{{ proyecto.id }}" data-csrf-token="{{ csrf_token }}" hidden></div>
</div>
