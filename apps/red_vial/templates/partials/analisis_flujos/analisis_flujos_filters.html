<form id="analisis-flujos-filters"
  hx-get="{% url 'analisis_flujos' proyecto.id %}"
  hx-target="#analisis-flujos-container"
  hx-swap="outerHTML"
  hx-push-url="true"
  hx-trigger="change from:.filter-checkbox delay:200ms, change from:select[name=fecha]"
  hx-sync="this:replace"
  class="bg-slate-200 rounded-lg p-4 mb-4">

  <div class="grid grid-cols-4 gap-4 w-360">
    <div class="filter-group">
      <div class="flex justify-between items-center mb-2">
        <label class="font-bold text-sm text-gray-700">PC(s)</label>
        <button type="button" class="text-xs text-indigo-600 hover:text-indigo-800"
          _="on click
            set checkboxes to my.closest('.filter-group').querySelectorAll('.filter-checkbox')
            repeat for el in checkboxes
              set el.checked to true
            end
            if checkboxes.length > 0
              trigger change on checkboxes[0]">
          Todos
        </button>
      </div>
      <div class="max-h-40 overflow-y-auto space-y-1 bg-slate-50">
        {% for nodo in available_nodos %}
        <label class="flex items-center gap-1.5 text-sm cursor-pointer hover:bg-slate-100 px-1 rounded">
          <input type="checkbox" name="nodo" value="{{ nodo.id }}" class="filter-checkbox"
            {% if nodo.id|stringformat:"s" in selected_nodos %}checked{% endif %}>
          PC-{{ nodo.numero_pc|stringformat:"02d" }}
        </label>
        {% endfor %}
      </div>
    </div>

    <div class="filter-group">
      <div class="flex justify-between items-center mb-2">
        <label class="font-bold text-sm text-gray-700">Movimiento(s)</label>
        <button type="button" class="text-xs text-indigo-600 hover:text-indigo-800"
          _="on click
            set checkboxes to my.closest('.filter-group').querySelectorAll('.filter-checkbox')
            repeat for el in checkboxes
              set el.checked to true
            end
            if checkboxes.length > 0
              trigger change on checkboxes[0]">
          Todos
        </button>
      </div>
      <div class="max-h-40 overflow-y-auto space-y-1 bg-slate-50">
        {% for mov in available_movimientos %}
        <label class="flex items-center gap-1.5 text-sm cursor-pointer hover:bg-slate-100 px-1 rounded">
          <input type="checkbox" name="movimiento" value="{{ mov.value }}" class="filter-checkbox"
            {% if mov.value in selected_movimientos %}checked{% endif %}>
          {{ mov.label }}
        </label>
        {% empty %}
        <span class="text-gray-400 text-xs">Selecciona PC(s)</span>
        {% endfor %}
      </div>
    </div>

    <div class="filter-group">
      <div class="flex justify-between items-center mb-2">
        <label class="font-bold text-sm text-gray-700">Periodo(s)</label>
        <button type="button" class="text-xs text-indigo-600 hover:text-indigo-800"
          _="on click
            set checkboxes to my.closest('.filter-group').querySelectorAll('.filter-checkbox')
            repeat for el in checkboxes
              set el.checked to true
            end
            if checkboxes.length > 0
              trigger change on checkboxes[0]">
          Todos
        </button>
      </div>
      <div class="max-h-40 overflow-y-auto space-y-1 bg-slate-50">
        {% for p in available_periodos %}
        <label class="flex items-center gap-1.5 text-sm cursor-pointer hover:bg-slate-100 px-1 rounded">
          <input type="checkbox" name="periodo" value="{{ p.id }}" class="filter-checkbox"
            {% if p.id|stringformat:"s" in selected_periodos %}checked{% endif %}>
          {{ p.codigo }} ({{ p.hora_inicio|time:"H:i" }}–{{ p.hora_fin|time:"H:i" }})
        </label>
        {% endfor %}
      </div>
    </div>

    <div>
      <label class="font-bold text-sm text-gray-700 block mb-2">Fecha</label>
      <select name="fecha"
        class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-white">
        <option value="">Todas las fechas</option>
        {% for f in available_fechas %}
        <option value="{{ f|date:'Y-m-d' }}" {% if selected_fecha == f|date:'Y-m-d' %}selected{% endif %}>{{ f|date:'d/m/Y' }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="flex justify-between items-center gap-2 mt-4">
    <div id="recalcular-msg" class="text-sm text-gray-600"></div>
    <div class="flex items-center gap-2">
      <a href="{% url 'analisis_flujos' proyecto.id %}"
        class="px-3 py-1.5 bg-gray-200 text-gray-700 text-sm rounded hover:bg-gray-300 transition-colors">
        Limpiar
      </a>
      <button type="button"
        class="px-3 py-1.5 bg-green-600 text-white text-sm rounded hover:bg-green-700 transition-colors"
        hx-post="{% url 'analisis_flujos' proyecto.id %}"
        hx-vals='{"action": "recalcular"}'
        hx-target="#recalcular-msg"
        hx-swap="innerHTML">
        Recalcular
      </button>
    </div>
  </div>
</form>
