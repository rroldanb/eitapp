<form hx-post="{% url 'import_upload' %}" hx-target="#import-step-content" hx-swap="innerHTML" hx-encoding="multipart/form-data" class="space-y-6">
  {% if error %}
    <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-sm text-red-700">{{ error }}</div>
  {% endif %}
  {% if message %}
    <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-sm text-green-700">{{ message }}</div>
  {% endif %}

  <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-indigo-400 transition-colors">
    <div class="flex flex-col items-center gap-3">
      <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center">
        <i class="fas fa-file-excel text-2xl text-indigo-600"></i>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-700">Selecciona un archivo Excel (.xlsx)</p>
        {% if proyecto %}
          <p class="text-xs text-gray-500 mt-1">Usa la <a href="{% url 'proyecto_generar_plantilla' proyecto.id %}" class="text-indigo-600 hover:underline">plantilla de ejemplo</a> como guía</p>
        {% endif %}
      </div>
      <label class="cursor-pointer inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium file-label">
        <i class="fas fa-folder-open"></i>
        <span>Examinar archivos</span>
        <input type="file" name="file" accept=".xlsx,.xls" class="hidden" id="excel-file-input">
      </label>
      <p id="file-name-display" class="text-xs text-gray-500 hidden">
        <i class="fas fa-check-circle text-green-500 mr-1"></i>
        <span id="file-name-text"></span>
      </p>
    </div>
  </div>

  <div class="flex justify-end gap-3">
    {% if proyecto %}
      <a href="{% url 'proyecto_detail' proyecto.id %}" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800"><i class="fas fa-times mr-1"></i>Cancelar</a>
    {% else %}
      <a href="{% url 'proyectos' %}" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800"><i class="fas fa-times mr-1"></i>Cancelar</a>
    {% endif %}
    <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium" id="submit-upload-btn">
      <i class="fas fa-upload mr-1"></i> Subir archivo
    </button>
  </div>
</form>

<script>
(function() {
  var input = document.getElementById('excel-file-input');
  var display = document.getElementById('file-name-display');
  var text = document.getElementById('file-name-text');
  var label = document.querySelector('.file-label span');
  if (input) {
    input.addEventListener('change', function() {
      if (this.files && this.files.length > 0) {
        text.textContent = this.files[0].name;
        display.classList.remove('hidden');
        if (label) label.textContent = 'Cambiar archivo';
      }
    });
  }
})();
</script>
