<table class="w-full divide-y divide-gray-200 table-results" id="arcos-table">
  <thead class="bg-slate-200">
    <tr>
      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase"
        aria-sort="{% if sort_by == 'codigo_arco' %}{% if sort_order == 'asc' %}ascending{% else %}descending{% endif %}{% else %}none{% endif %}">
        <a role="button"
           hx-get="?sort_by=codigo_arco&sort_order={% if sort_by == 'codigo_arco' and sort_order == 'asc' %}desc{% else %}asc{% endif %}"
           hx-target="#arcos-table"
           hx-swap="outerHTML"
           hx-push-url="true"
           class="inline-flex items-center gap-1 hover:text-indigo-700 {% if sort_by == 'codigo_arco' %}sortable-active {% if sort_order == 'asc' %}sorted-asc{% else %}sorted-desc{% endif %}{% endif %}">
          Código
          {% if sort_by == 'codigo_arco' %}
            {% if sort_order == 'asc' %}↑{% else %}↓{% endif %}
          {% endif %}
        </a>
      </th>
      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase" 
      aria-sort="{% if sort_by == 'origen' %}{% if sort_order == 'asc' %}ascending{% else %}descending{% endif %}{% else %}none{% endif %}">
        <a role="button"
           hx-get="?sort_by=origen&sort_order={% if sort_by == 'origen' and sort_order == 'asc' %}desc{% else %}asc{% endif %}"
           hx-target="#arcos-table"
           hx-swap="outerHTML"
           hx-push-url="true"
           class="inline-flex items-center gap-1 hover:text-indigo-700 {% if sort_by == 'origen' %}sortable-active {% if sort_order == 'asc' %}sorted-asc{% else %}sorted-desc{% endif %}{% endif %}">
          Origen

        </a>
      </th>
      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase" 
      aria-sort="{% if sort_by == 'destino' %}{% if sort_order == 'asc' %}ascending{% else %}descending{% endif %}{% else %}none{% endif %}">
        <a role="button"
           hx-get="?sort_by=destino&sort_order={% if sort_by == 'destino' and sort_order == 'asc' %}desc{% else %}asc{% endif %}"
           hx-target="#arcos-table"
           hx-swap="outerHTML"
           hx-push-url="true"
           class="inline-flex items-center gap-1 hover:text-indigo-700 {% if sort_by == 'destino' %}sortable-active {% if sort_order == 'asc' %}sorted-asc{% else %}sorted-desc{% endif %}{% endif %}">
          Destino

        </a>
      </th>
      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase" aria-sort="{% if sort_by == 'longitud' %}{% if sort_order == 'asc' %}ascending{% else %}descending{% endif %}{% else %}none{% endif %}">
        <a role="button"
           hx-get="?sort_by=longitud&sort_order={% if sort_by == 'longitud' and sort_order == 'asc' %}desc{% else %}asc{% endif %}"
           hx-target="#arcos-table"
           hx-swap="outerHTML"
           hx-push-url="true"
           class="inline-flex items-center gap-1 hover:text-indigo-700 {% if sort_by == 'longitud' %}sortable-active {% if sort_order == 'asc' %}sorted-asc{% else %}sorted-desc{% endif %}{% endif %}">
          Longitud

        </a>
      </th>
      <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Acciones</th>
    </tr>
  </thead>
  <tbody id="arcos-table-body" class="divide-y divide-gray-200">
    {% include 'partials/Arcos/arcos_table_body.html' with proyecto=proyecto arcos=arcos %}
  </tbody>
</table>
