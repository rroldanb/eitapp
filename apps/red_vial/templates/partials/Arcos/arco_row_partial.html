<tr class="hover:bg-gray-50">
            <form
              id="updatableForm{{ arco.id }}"
              method="POST"
              enctype="multipart/form-data"
              action="{% url 'arco_update' arco.id %}"
            >
              {% csrf_token %}

              <td class="px-4 py-3 text-gray-700 font-medium">{{ arco.codigo_arco }}</td>

              <td class="px-4 py-3">
                <select class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" name="nodo_origen" required>
                  <option value="">Seleccionar nodo...</option>
                  {% for nodo in proyecto.nodos.all %}
                  <option value="{{ nodo.id }}" {% if arco.nodo_origen.id == nodo.id %}selected{% endif %}>
                    {{ nodo.numero }}{% if nodo.calle_1 %} - {{ nodo.calle_1.nombre }}{% endif %}{% if nodo.calle_2 %} / {{ nodo.calle_2.nombre }}{% endif %}
                  </option>
                  {% endfor %}
                </select>
              </td>
              <td class="px-4 py-3">
                <select class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" name="nodo_destino" required>
                  <option value="">Seleccionar nodo...</option>
                  {% for nodo in proyecto.nodos.all %}
                  <option value="{{ nodo.id }}" {% if arco.nodo_destino.id == nodo.id %}selected{% endif %}>
                    {{ nodo.numero }}{% if nodo.calle_1 %} - {{ nodo.calle_1.nombre }}{% endif %}{% if nodo.calle_2 %} / {{ nodo.calle_2.nombre }}{% endif %}
                  </option>
                  {% endfor %}
                </select>
              </td>
              <td class="px-4 py-3">
                <input
                  type="number"
                  step="1"
                  class="w-32 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500"
                  name="longitud"
                  value="{{ arco.longitud|default:'' }}"
                  required
                />
              </td>
              <td class="px-4 py-3">
                <button type="submit" class="px-3 py-1 text-sm border border-indigo-600 text-indigo-600 rounded hover:bg-indigo-600 hover:text-white transition-colors">
                  Actualizar
                </button>
            </form>
                <a href="{% url 'arco_delete' arco.id }}" class="ml-1 px-3 py-1 text-sm border border-red-600 text-red-600 rounded hover:bg-red-600 hover:text-white transition-colors">Eliminar</a>
              </td>
          </tr>
