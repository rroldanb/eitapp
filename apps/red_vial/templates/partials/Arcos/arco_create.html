<tr id="new-arco-form-row">
  <td colspan="5" class="px-2 py-3 {% if form.errors %}bg-red-50{% else %}bg-green-100{% endif %}">
    <form id="new-arco-form"
      data-action="create"
      hx-post="{% url 'arco_create' proyecto.id %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      {% if form.errors %}
      <div class="mb-2 space-y-1">
        {% for field in form %}
          {% for error in field.errors %}
            <p class="text-red-600 text-xs error-message">{{ field.label }}: {{ error }}</p>
          {% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}
          <p class="text-red-600 text-xs error-message">{{ error }}</p>
        {% endfor %}
      </div>
      {% endif %}
      <div class="flex flex-wrap items-center gap-4 justify-center">
        <select name="nodo_origen" class="bg-slate-50 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
          <option value="">Nodo Origen...</option>
          {% for nodo in proyecto.nodos.all %}
            <option value="{{ nodo.id }}">{{ nodo }}</option>
          {% endfor %}
        </select>

        <select name="nodo_destino" class="bg-slate-50 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
          <option value="">Nodo Destino...</option>
          {% for nodo in proyecto.nodos.all %}
            <option value="{{ nodo.id }}">{{ nodo }}</option>
          {% endfor %}
        </select>

        <input type="number" name="longitud" step="0.1" 
        placeholder="Longitud (m)" 
        class="bg-slate-50 px-2 py-1 border border-gray-300 rounded w-28 focus:ring-2 focus:ring-indigo-500" />

        <button type="submit" class="bg-slate-50 px-2 py-1  border border-green-900 text-green-900 rounded hover:bg-green-600 hover:text-white transition-colors" data-action="create">
          Guardar
        </button>

        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin htmx-indicator" style="display:none;" role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
