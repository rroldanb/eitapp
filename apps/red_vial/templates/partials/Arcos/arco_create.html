{# Partial template for creating a new arco #}

<tr id="new-arco-form-row">
  <td colspan="5" class="px-2 py-3 {% if form.errors %}bg-red-100{% else %}bg-green-100{% endif %}">
    <form id="new-arco-form"
      data-action="create"
      hx-post="{% url 'arco_create' proyecto.id %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      {% if form.is_bound and form.errors %}
      <div class="mb-2 space-y-1">
        {% for field in form %}
          {% for error in field.errors %}
            <p class="text-red-600 text-sm error-message">{{ field.label }}: {{ error }}</p>
          {% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}
          <p class="text-red-600 text-sm error-message">{{ error }}</p>
        {% endfor %}
      </div>
      {% endif %}
      <div class="flex flex-wrap items-center gap-4 justify-center">
        <select name="nodo_origen" aria-label="Nodo origen"
          class="bg-slate-50 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
          <option value="">Nodo Origen...</option>
          {% for nodo in proyecto.nodos.all %}
            <option value="{{ nodo.id }}">{{ nodo }}</option>
          {% endfor %}
        </select>

        <select name="nodo_destino" aria-label="Nodo destino"
          class="bg-slate-50 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500">
          <option value="">Nodo Destino...</option>
          {% for nodo in proyecto.nodos.all %}
            <option value="{{ nodo.id }}">{{ nodo }}</option>
          {% endfor %}
        </select>

        <input type="number" name="longitud" aria-label="Longitud" step="0.1"
          placeholder="Longitud (m)"
          class="bg-slate-50 px-2 py-1 border border-gray-300 rounded w-28 focus:ring-2 focus:ring-indigo-500" />

        <button type="submit"
          class="px-2 py-1 bg-indigo-600 text-white rounded-lg hover:bg-indigo-800 transition-colors font-medium action-btn"
          data-action="create">
          Agregar
          <i class="far fa-save ml-1" aria-hidden="true"></i>
        </button>

        <span id="create-indicator"
          class="inline-block w-3 h-3 border-2 border-t-transparent border-blue-600 rounded-full animate-spin mr-1 htmx-indicator"
          role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
