<tr id="new-arco-form-row">
  <td colspan="4" class="px-4 py-3">
    <form id="new-arco-form"
      data-action="create"
      hx-post="{% url 'arco_create' proyecto.id %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      <div class="flex flex-wrap items-center gap-3">
        <select name="nodo_origen" class="form-control px-3 py-2 border border-gray-300 rounded">
          <option value="">Nodo Origen...</option>
          {% for nodo in proyecto.nodos.all %}
            <option value="{{ nodo.id }}">{{ nodo.numero }}</option>
          {% endfor %}
        </select>

        <select name="nodo_destino" class="form-control px-3 py-2 border border-gray-300 rounded">
          <option value="">Nodo Destino...</option>
          {% for nodo in proyecto.nodos.all %}
            <option value="{{ nodo.id }}">{{ nodo.numero }}</option>
          {% endfor %}
        </select>

        <input type="number" name="longitud" step="0.1" placeholder="Longitud (m)" class="form-control px-3 py-2 border border-gray-300 rounded w-32" />

        <button type="submit" class="px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors" data-action="create">
          Guardar
        </button>

        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin htmx-indicator" style="display:none;" role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
