<tr id="calle-row-{{ calle.id }}" class="hover:bg-gray-50">
  <td class="px-2 py-1 editable-field" data-field="numero">
    <span class="field-display"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ calle.id }}">
      {{ calle.numero }}
    </span>
    <input type="number" name="numero" value="{{ calle.numero }}"
      class="field-input hidden w-20 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500"
      _="on keydown[key == 'Enter']
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ calle.id }}">
  </td>
  <td class="px-2 py-1 editable-field" data-field="nombre">
    <span class="field-display"
      _="on click
        set inp to me.nextElementSibling
        add .hidden to me
        remove .hidden from inp
        call inp.focus()
        call inp.setSelectionRange(inp.value.length, inp.value.length)
        remove .hidden from #save-row-btn-{{ calle.id }}">
      {{ calle.nombre }}
    </span>
    <input type="text" name="nombre" value="{{ calle.nombre }}"
  class="field-input hidden w-full px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500"
  _="on keydown[key == 'Enter']
    set btn to #save-row-btn-{{ calle.id }}
    trigger click on btn
    add .hidden to me
    remove .hidden from previous .field-display
  ">
  </td>
  <td class="px-2 py-1 text-gray-600">{{ calle.nodos_total }} nodo(s)</td>
  <td class="px-2 py-1 flex gap-1">
    <button type="button"
      id="save-row-btn-{{ calle.id }}"
      aria-label="Guardar calle"
      class="save-row-btn hidden px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors"
      hx-put="{% url 'calle_update' calle.id %}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML">
      Guardar
    </button>

    <button type="button" 
    aria-label="Eliminar calle"
    class="px-3 py-1 text-sm border border-red-600 text-red-600 rounded hover:bg-red-600 hover:text-white transition-colors action-btn" 
    data-action="delete"
      hx-delete="{% url 'calle_delete' calle.id %}"

      hx-target="closest tr"
      hx-swap="outerHTML transition:true swap:50"
      hx-indicator="#delete-indicator-{{ calle.id }}"
    >
      <span id="delete-indicator-{{ calle.id }}" class="inline-block w-3 h-3 border-2 border-t-transparent border-red-600 rounded-full animate-spin mr-1 htmx-indicator" 
      style="display: none;"></span>
      Eliminar
    </button>


  </td>
</tr>
