{# Partial template for creating a new calle #}

<tr id="new-calle-form-row">
  <td colspan="4" class="px-2 py-3 {% if form.errors %}bg-red-100{% else %}bg-green-100{% endif %}">
    <form id="new-calle-form"
      data-action="create"
      hx-post="{% url 'calle_create' proyecto.id %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      {% if form.is_bound and form.errors %} 
      <div class="mb-2 space-y-1">
        {% for field in form %}
          {% for error in field.errors %}
            <p class="text-red-600 text-sm error-message">{{ field.label }}: {{ error }}</p>
          {% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}
          <p class="text-red-600 text-sm error-message">{{ error }}</p>
        {% endfor %}
      </div>
      {% endif %}
      <div class="flex flex-wrap items-center gap-4 justify-center">
        <input type="number" name="numero" id="new_number"
          class="bg-slate-50 form-control w-20 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 {% if form.numero.errors %}border-red-500{% else %}border-gray-300{% endif %}"
          value="{{ proyecto.calles.count|add:1 }}"
        />
        <input type="text" name="nombre"
          class="bg-slate-50 form-control w-100 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 calle-nombre"
          placeholder="Nombre de la calle" required />
        <button type="submit" class="bg-slate-50 px-2 py-1  border border-green-900 text-green-900 rounded hover:bg-green-600 hover:text-white transition-colors" data-action="create">
          Guardar
        </button>
        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin htmx-indicator" style="display:none;" role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
