{# Partial template for creating a new calle #}

<tr id="new-calle-form-row">
  <td colspan="4" class="px-4 py-3">
    <form id="new-calle-form"
      data-action="create"
      hx-post="{% url 'calle_create' proyecto.id %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      <div class="flex flex-wrap items-center gap-3">
        <input type="number" name="numero" id="new_number"
          class="form-control w-20 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500"
          value="{{ proyecto.calles.count|add:1 }}"
        />
        <input type="text" name="nombre"
          class="form-control flex-1 min-w-[220px] px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 calle-nombre"
          placeholder="Nombre de la calle" required />
        <button type="submit" class="px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors" data-action="create">
          Guardar
        </button>
        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin htmx-indicator" style="display:none;" role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
