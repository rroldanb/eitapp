{% load l10n %}
<tr id="periodo-create-row" class="periodo-create-row">
  <td class="px-2 py-1 whitespace-nowrap">
    <select name="codigo" class="w-full px-2 py-1 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      {% for v, l in form.codigo.field.choices %}
        <option value="{{ v }}" {% if form.codigo.value == v %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
    {% if form.codigo.errors %}
      <div class="text-xs text-red-600 mt-0.5">{{ form.codigo.errors.0 }}</div>
    {% endif %}
  </td>
  <td class="px-2 py-1 whitespace-nowrap">
    <input type="time" name="hora_inicio" value="{{ form.hora_inicio.value|time:'H:i'|default:'' }}"
      class="w-full px-2 py-1 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50">
    {% if form.hora_inicio.errors %}
      <div class="text-xs text-red-600 mt-0.5">{{ form.hora_inicio.errors.0 }}</div>
    {% endif %}
  </td>
  <td class="px-2 py-1 whitespace-nowrap">
    <input type="time" name="hora_fin" value="{{ form.hora_fin.value|time:'H:i'|default:'' }}"
      class="w-full px-2 py-1 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50">
    {% if form.hora_fin.errors %}
      <div class="text-xs text-red-600 mt-0.5">{{ form.hora_fin.errors.0 }}</div>
    {% endif %}
  </td>
  <td class="px-2 py-1 text-center whitespace-nowrap">
    <input type="checkbox" name="es_laboral" class="form-check-input" {% if form.es_laboral.value %}checked{% endif %} value="true">
  </td>
  <td class="px-2 py-1 flex gap-1 whitespace-nowrap">
    <button type="button"
      class="px-2 py-1 text-xs border border-blue-600 text-blue-600 rounded hover:bg-blue-600 hover:text-white transition-colors"
      hx-post="{% url 'periodo_create' proyecto.id %}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML"
      hx-indicator="#create-indicator">
      <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-blue-600 rounded-full animate-spin mr-1 htmx-indicator" style="display: none;"></span>
      Crear
    </button>
  </td>
</tr>
