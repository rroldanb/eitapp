{% load l10n %}
<tr id="periodo-create-row"
  class="periodo-create-row {% if form.errors %}bg-red-100{% else %}bg-green-100{% endif %}"
  hx-get="{% url 'periodo_create' proyecto.id %}"
  hx-trigger="periodo-deleted from:body, periodo-created from:body"
  hx-target="this"
  hx-swap="outerHTML">
  <td colspan="5" class="px-2 py-3">
    <form id="new-periodo-form"
      data-action="create"
      hx-post="{% url 'periodo_create' proyecto.id %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      {% if form.is_bound and form.errors %}
      <div class="mb-2 space-y-1">
        {% for field in form %}
          {% for error in field.errors %}
            <p class="text-red-600 text-sm error-message">{{ field.label }}: {{ error }}</p>
          {% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}
          <p class="text-red-600 text-sm error-message">{{ error }}</p>
        {% endfor %}
      </div>
      {% endif %}
      <div class="flex flex-wrap items-center gap-4 justify-between">
        <select name="codigo" aria-label="Código de período"
          class="bg-slate-50 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 text-sm">
          {% for v, l in form.codigo.field.choices %}
            <option value="{{ v }}" {% if form.codigo.value == v %}selected{% endif %}>{{ l }}</option>
          {% endfor %}
        </select>
        <input type="time" name="hora_inicio" value="{{ form.hora_inicio.value|time:'H:i'|default:'' }}" aria-label="Hora inicio"
          class="bg-slate-50 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" />
        <input type="time" name="hora_fin" value="{{ form.hora_fin.value|time:'H:i'|default:'' }}" aria-label="Hora fin"
          class="bg-slate-50 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" />
        <label class="flex items-center gap-1 text-sm text-gray-700">
          <input type="checkbox" name="es_laboral" class="form-check-input" {% if form.es_laboral.value %}checked{% endif %} value="true">
          Laboral
        </label>
        <button type="submit"
          class="px-2 py-1 bg-indigo-600 text-white rounded-lg hover:bg-indigo-800 transition-colors font-medium action-btn mr-20"
          data-action="create"
          aria-label="Agregar periodo">
          Agregar
          <i class="far fa-save ml-1" aria-hidden="true"></i>
        </button>
        <span id="create-indicator"
          class="inline-block w-3 h-3 border-2 border-t-transparent border-blue-600 rounded-full animate-spin mr-1 htmx-indicator"
          role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
