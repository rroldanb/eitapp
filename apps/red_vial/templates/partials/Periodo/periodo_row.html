{% load l10n %}
<tr id="periodo-row-{{ periodo.id }}" class="periodo-row hover:bg-gray-50" data-periodo-id="{{ periodo.id }}">
  <td class="px-2 py-1 whitespace-nowrap editable-field" data-field="codigo">
    <span class="field-display cursor-pointer"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ periodo.id }}">
      {{ periodo.codigo }} - {{ periodo.get_codigo_display }}
    </span>
    <select name="codigo"
      class="field-input hidden w-full max-w-[240px] px-2 py-1 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50"
      _="on change
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ periodo.id }}">
      {% for v, label in periodo.TipoPeriodo.choices %}
        <option value="{{ v }}" {% if periodo.codigo == v %}selected{% endif %}>{{ v }} - {{ label }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="px-2 py-1 whitespace-nowrap editable-field" data-field="hora_inicio">
    <span class="field-display cursor-pointer"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ periodo.id }}">
      {{ periodo.hora_inicio|time:'H:i'|default:'' }}
    </span>
    <input type="time" name="hora_inicio" value="{{ periodo.hora_inicio|time:'H:i'|default:'' }}"
      class="field-input hidden w-full px-2 py-1 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500"
      _="on keydown[key == 'Enter']
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ periodo.id }}">
  </td>
  <td class="px-2 py-1 whitespace-nowrap editable-field" data-field="hora_fin">
    <span class="field-display cursor-pointer"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ periodo.id }}">
      {{ periodo.hora_fin|time:'H:i'|default:'' }}
    </span>
    <input type="time" name="hora_fin" value="{{ periodo.hora_fin|time:'H:i'|default:'' }}"
      class="field-input hidden w-full px-2 py-1 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500"
      _="on keydown[key == 'Enter']
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ periodo.id }}">
  </td>
  <td class="px-2 py-1 text-center whitespace-nowrap editable-field" data-field="es_laboral">
    <span class="field-display cursor-pointer"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input-container
        remove .hidden from #save-row-btn-{{ periodo.id }}">
      {% if periodo.es_laboral %}Sí{% else %}No{% endif %}
    </span>
    <span class="field-input-container hidden">
      <input type="checkbox" name="es_laboral" class="form-check-input"
        {% if periodo.es_laboral %}checked{% endif %} value="true"
        _="on change
          set container to me.closest('.field-input-container')
          add .hidden to container
          remove .hidden from container.previousElementSibling
          trigger click on #save-row-btn-{{ periodo.id }}">
    </span>
  </td>
  <td class="px-2 py-1 flex gap-1 whitespace-nowrap">
    <button type="button"
      id="save-row-btn-{{ periodo.id }}"
      aria-label="Guardar periodo"
      class="save-row-btn hidden px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors"
      hx-put="{% url 'periodo_update' periodo.id %}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML">
      Guardar
    </button>
    <button type="button"
      aria-label="Eliminar periodo"
      class="px-3 py-1 text-sm border border-red-600 text-red-600 rounded hover:bg-red-600 hover:text-white transition-colors"
      hx-delete="{% url 'periodo_delete' periodo.id %}"
      hx-target="closest tr"
      hx-swap="outerHTML">
      Eliminar
    </button>
  </td>
</tr>
