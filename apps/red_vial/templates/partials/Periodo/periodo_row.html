{% load l10n %}
<tr id="periodo-row-{{ item.id }}" class="periodo-row hover:bg-gray-50" data-periodo-id="{{ item.id }}">
  <td class="px-2 py-1 whitespace-nowrap">
    <span class="text-sm font-medium text-gray-700">{{ item.codigo }} — {{ item.get_codigo_display }}</span>
    <input type="hidden" name="codigo" value="{{ item.codigo }}">
  </td>
  <td class="px-2 py-1 whitespace-nowrap">
    <input type="time" name="hora_inicio" value="{{ item.hora_inicio|time:'H:i'|default:'' }}"
      class="w-full px-2 py-1 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50">
  </td>
  <td class="px-2 py-1 whitespace-nowrap">
    <input type="time" name="hora_fin" value="{{ item.hora_fin|time:'H:i'|default:'' }}"
      class="w-full px-2 py-1 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50">
  </td>
  <td class="px-2 py-1 text-center whitespace-nowrap">
    <input type="checkbox" name="es_laboral" class="form-check-input" {% if item.es_laboral %}checked{% endif %} value="true">
  </td>
  <td class="px-2 py-1 flex gap-1 whitespace-nowrap">
    <button type="button"
      class="px-2 py-1 text-xs border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors"
      hx-put="{% url 'periodo_update' item.id %}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML"
      hx-indicator="#save-indicator-{{ item.id }}">
      <span id="save-indicator-{{ item.id }}" class="inline-block w-3 h-3 border-2 border-t-transparent border-green-600 rounded-full animate-spin mr-1 htmx-indicator" style="display: none;"></span>
      OK
    </button>
    <button type="button"
      class="px-2 py-1 text-xs border border-red-600 text-red-600 rounded hover:bg-red-600 hover:text-white transition-colors"
      hx-delete="{% url 'periodo_delete' item.id %}"
      hx-target="closest tr"
      hx-swap="outerHTML"
      hx-confirm="¿Eliminar período {{ item.get_codigo_display }}?">
      X
    </button>
  </td>
</tr>
