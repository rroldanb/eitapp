<tr id="new-regulacion-form-row" class="{% if form.errors %}bg-red-50{% else %}bg-green-100{% endif %}">
  <td colspan="3" class="px-4 py-3">
    <form id="new-regulacion-form"
      data-action="create"
      hx-post="{% url 'regulacion_create' %}"
      hx-target="closest tr"
      hx-swap="afterend"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      hx-indicator="#create-indicator"
    >
      {% csrf_token %}
      <div class="flex flex-wrap items-center gap-3">
        <input type="text" name="codigo"
          class="form-control w-24 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 uppercase bg-slate-50"
          placeholder="Código" maxlength="20" required />
        <input type="text" name="descripcion"
          class="form-control flex-1 min-w-[220px] max-w-2/3 px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 bg-slate-50"
          placeholder="Descripción" required />
        <button type="submit" class="px-2 py-1 text-base border-2 border-blue-600 text-blue-600 rounded hover:bg-blue-600 hover:text-white transition-colors" data-action="create">
          Guardar
        </button>
        <span id="create-indicator" class="inline-block w-3 h-3 border-2 border-t-transparent border-blue-600 rounded-full animate-spin mr-1 htmx-indicator" style="display:none;" role="status" aria-hidden="true"></span>
      </div>
    </form>
  </td>
</tr>
