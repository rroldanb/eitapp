<tr id="regulacion-row-{{ regulacion.id }}" class="regulacion-row hover:bg-gray-50" data-regulacion-id="{{ regulacion.id }}">
  <td class="px-4 py-1 editable-field" data-field="codigo">
    <span class="field-display"
      _="on click
        add .hidden to me
        remove .hidden from next .field-input
        call me.nextElementSibling.focus()
        remove .hidden from #save-row-btn-{{ regulacion.id }}">
      {{ regulacion.codigo }}
    </span>
    <input type="text" name="codigo" value="{{ regulacion.codigo }}"
      class="field-input hidden w-24 px-2 py-1 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 uppercase" maxlength="20"
      _="on keydown[key == 'Enter']
        add .hidden to me
        remove .hidden from previous .field-display
        trigger click on #save-row-btn-{{ regulacion.id }}">
  </td>
  <td class="px-4 py-1 editable-field" data-field="descripcion">
    <span class="field-display"
      _="on click
        set inp to me.nextElementSibling
        add .hidden to me
        remove .hidden from inp
        call inp.focus()
        call inp.setSelectionRange(inp.value.length, inp.value.length)
        remove .hidden from #save-row-btn-{{ regulacion.id }}">
      {{ regulacion.descripcion }}
    </span>
    <input type="text" name="descripcion" value="{{ regulacion.descripcion }}"
      class="field-input hidden w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" maxlength="255"
      _="on keydown[key == 'Enter']
        set btn to #save-row-btn-{{ regulacion.id }}
        trigger click on btn
        add .hidden to me
        remove .hidden from previous .field-display
      ">
  </td>
  <td class="px-4 py-1 flex gap-2">
    <button type="button"
      id="save-row-btn-{{ regulacion.id }}"
      class="save-row-btn hidden px-3 py-1 text-sm border border-green-600 text-green-600 rounded hover:bg-green-600 hover:text-white transition-colors"
      hx-put="{% url 'regulacion_update' regulacion.id %}"
      hx-include="closest tr"
      hx-target="closest tr"
      hx-swap="outerHTML"
      aria-label="Guardar regulación"
    >
      Guardar
    </button>
    <button type="button"
      class="px-3 py-1 text-sm border border-red-600 text-red-600 rounded hover:bg-red-600 hover:text-white transition-colors"
      hx-delete="{% url 'regulacion_delete' regulacion.id %}"
      hx-target="closest tr"
      hx-swap="outerHTML"
      aria-label="Eliminar regulación"
    >
      Eliminar
    </button>
  </td>
</tr>
