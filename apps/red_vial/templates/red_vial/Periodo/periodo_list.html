{% extends "proyecto_base.html" %}
{% load static %}

{% block section_content %}
<div class="section-header flex justify-between items-center mb-6">
  <h3 class="text-xl font-semibold text-gray-800">Períodos de Medición</h3>
  <span class="ml-auto px-3 py-1 bg-indigo-100 text-indigo-900 text-lg rounded-full">{{ periodos|length }}</span>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <div class="p-4">
    <div class="overflow-x-auto">
      {% include 'partials/Periodo/periodo_table.html' with proyecto=proyecto periodos=periodos form=form %}
    </div>
  </div>
</div>

<div id="periodo-list-config" data-proyecto-id="{{ proyecto.id }}" data-csrf-token="{{ csrf_token }}" hidden></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/crud_events.js' %}"></script>
{% endblock extra_js %}
