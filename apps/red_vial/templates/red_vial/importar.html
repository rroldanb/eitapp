{% extends "proyecto_base.html" %}
{% load static %}

{% block section_content %}

<div class="section-header flex justify-between items-center mb-6">
  <h2 class="text-xl font-semibold text-gray-800">Importar datos desde Excel</h2>
</div>

<div id="import-spinner" class="fixed inset-0 z-50 flex items-center justify-center bg-white/60 pointer-events-none opacity-0 transition-opacity duration-200">
  <div class="flex flex-col items-center gap-3 p-6 bg-white rounded-xl shadow-xl border border-gray-200">
    <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <p class="text-sm font-medium text-gray-600">Procesando...</p>
  </div>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <div id="import-stepper-bar">
    {% include 'partials/Import/stepper.html' %}
  </div>
  <div class="p-6" id="import-step-content" hx-indicator="#import-spinner">
    {% include 'partials/Import/paso1_upload.html' %}
  </div>
</div>

<div id="import-config" data-proyecto-id="{{ proyecto.id }}" data-csrf-token="{{ csrf_token }}" hidden></div>

<style>
.htmx-request#import-spinner {
  opacity: 1;
  pointer-events: auto;
}
.htmx-request .btn-spinner {
  display: inline-block;
}
</style>
{% endblock %}
