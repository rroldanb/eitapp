{% extends "proyecto_base.html" %}
{% load static %}
{% load red_vial_extras %}

{% block section_content %}
<div class="section-header flex justify-between items-center mb-6">
  <h3 class="text-xl font-semibold text-gray-800">Análisis de Flujos</h3>
  <span class="ml-auto px-3 py-1 bg-indigo-100 text-indigo-900 text-lg rounded-full">{{ total_records }} registros</span>
</div>

{% include 'partials/analisis_flujos/analisis_flujos_container.html' %}
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/crud_events.js' %}"></script>
<script>
  document.body.addEventListener('resumenes-recalculados', function(evt) {
    var msg = document.getElementById('recalcular-msg');
    if (msg) {
      msg.textContent = 'Resúmenes recalculados correctamente. Actualiza los filtros para ver los cambios.';
      msg.className = 'text-sm text-green-600';
      setTimeout(function() { msg.textContent = ''; }, 5000);
    }
  });
</script>
{% endblock extra_js %}
