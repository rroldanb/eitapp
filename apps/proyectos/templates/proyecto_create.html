{% extends "base.html" %}
{% load static %}

{% block content %}

<main class="container mx-auto px-4 py-8">
    <div class="bg-gray-100 p-6 rounded-lg shadow-md w-full sm:max-w-3xl mx-auto">
        <form action="{% url 'proyecto_create' %}" method="POST" class="bg-white p-6 rounded-lg shadow space-y-4">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Nuevo Proyecto</h1>

            {% if error %}
            <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                {{ error }}
            </div>
            {% endif %}

            {% csrf_token %}

            <img id="preview" style="display:none;" class="w-full rounded-lg shadow"/>
            <textarea id="paste-area" aria-label="Área para pegar imagen" placeholder="Pega aquí tu imagen (Ctrl+V)" rows="1" class="w-full p-2 border border-gray-300 rounded"></textarea>
            <input type="hidden" name="image_file" id="image_file">

            {{ form }}

            <button type="submit" class="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium mt-2"
                onclick="this.disabled=true; this.form.submit();">
                Guardar
            </button>
            <a href="{% url 'proyectos' %}" class="block w-full text-center px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-medium">
                Volver
            </a>
        </form>
    </div>
</main>

<script src="{% static 'js/features/paste-image.js' %}" defer></script>

{% endblock %}
