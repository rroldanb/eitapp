{% extends "base.html" %}

{% block content %}

<main class="container mx-auto px-4 py-8">
    <div class="bg-gray-100 p-6 rounded-lg shadow-md max-w-3xl mx-auto">
        <form action="{% url 'proyecto_create' %}" method="POST" class="bg-white p-6 rounded-lg shadow space-y-4">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Nuevo Proyecto</h1>

            {% if error %}
            <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                {{ error }}
            </div>
            {% endif %}

            {% csrf_token %}

            <img id="preview" style="display:none;" class="w-full rounded-lg shadow"/>
            <textarea id="paste-area" placeholder="Pega aquí tu imagen (Ctrl+V)" rows="1" class="w-full p-2 border border-gray-300 rounded"></textarea>
            <input type="hidden" name="image_file" id="image_file">

            {{ form }}

            <button type="submit" class="w-full px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition-colors font-medium mt-2">
                Guardar
            </button>
            <a href="{% url 'proyectos' %}" class="block w-full text-center px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-medium">
                Volver
            </a>
        </form>
    </div>
</main>

<script>
    document.getElementById("paste-area").addEventListener("paste", async (event) => {
    const items = event.clipboardData.items;

    for (let item of items) {
        if (item.type.indexOf("image") !== -1) {
            const file = item.getAsFile();

            // Preview
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById("preview").src = e.target.result;
                document.getElementById("preview").style.display = "block";
            };
            reader.readAsDataURL(file);

            // Guardar en input hidden como base64
            const base64 = await toBase64(file);
            document.getElementById("image_file").value = base64;
        }
    }
});

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}
</script>

{% endblock %}
