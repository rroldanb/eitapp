{% extends "proyecto_base.html" %}

{% block section_content %}

<div class="section-header flex justify-between items-center mb-6">
  <h3 class="text-xl font-semibold text-gray-800">Detalles del Proyecto</h3>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <div class="p-6">
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="flex justify-between pt-4 border-t">
        <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium">
          Actualizar
        </button>
        <a href="{% url 'proyectos' %}" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-medium">
          Volver
        </a>
      </div>
    </form>

    <!-- Sección de eliminar proyecto -->
    <div class="mt-6 pt-4 border-t">
      <form action="{% url 'proyecto_delete' proyecto.id %}" method="POST" onsubmit="return confirm('¿Estás seguro de eliminar este proyecto? Esta acción no se puede deshacer.');">
        {% csrf_token %}
        <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium">
          Eliminar Proyecto
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
